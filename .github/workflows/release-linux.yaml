name: Release (Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux packages (x64)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find or create the draft release
        id: release
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The mac, Windows and Linux workflows all upload to one draft release.
          # Staggered starts keep them from each creating their own.
          sleep 40
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(jq -r .version app/src-tauri/tauri.conf.json)"
          fi
          find_release() {
            gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -1
          }
          id="$(find_release)"
          if [ -z "$id" ]; then
            gh release create "$tag" --repo "${{ github.repository }}" --draft --target "${{ github.sha }}" \
              --title "Grimoire $tag" \
              --notes "Download the DMG for macOS, the -setup.exe (or .msi) for Windows, or the .deb, .rpm or .AppImage for Linux, from the assets below."
            id="$(find_release)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Install system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf rpm file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Check the install script
        working-directory: .
        run: bash -n scripts/install.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        working-directory: app/src-tauri
        run: cargo test

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --bundles deb,rpm,appimage
          releaseId: ${{ steps.release.outputs.id }}
