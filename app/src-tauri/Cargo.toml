[package]
name = "grimoire"
version = "1.0.0"
description = "A local-first desktop app for studying what you find on the internet"
edition = "2021"
rust-version = "1.80"

[lib]
name = "grimoire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
deunicode = "1"
notify = "8"
notify-debouncer-mini = "0.7"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
sha2 = "0.10"
url = "2"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
